<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AxiX 新手注册教程</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg1:#07100f; --bg2:#0a1112; --panel:#0c1517; --panel2:#101b1d;
    --border:#29413e; --acc:#4fd1b5; --acc2:#8ff0dc; --txt:#c7d5d2;
    --dim:#7d9691; --bright:#eaf6f3; --glow:rgba(79,209,181,.35);
  }
  html,body { min-height:100%; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;
    color:var(--txt); min-height:100vh; display:flex; flex-direction:column;
    background:
      radial-gradient(900px 500px at 50% -5%, rgba(79,209,181,.14), transparent 60%),
      radial-gradient(700px 400px at 50% 105%, rgba(79,209,181,.08), transparent 60%),
      linear-gradient(170deg,#07100f 0%,#0a1112 55%,#081211 100%);
  }
  /* ── 顶栏 ── */
  .bar { display:flex; align-items:center; gap:14px; padding:16px clamp(14px,3vw,36px); }
  .bar .brand { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .bar .brand img { width:34px; height:34px; border-radius:9px; box-shadow:0 0 18px rgba(79,209,181,.4); }
  .bar .brand span { font-size:17px; font-weight:900; color:var(--bright); }
  .bar .brand b { color:var(--acc); }
  .bar .title { flex:1; text-align:center; font-size:15px; font-weight:700; color:var(--dim); letter-spacing:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .iconbtn { width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--panel);
    color:var(--txt); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .iconbtn:hover { border-color:#3a5a54; }
  .langmenu { position:fixed; background:#101b1d; border:1px solid var(--border); border-radius:10px; padding:6px 0;
    z-index:99; min-width:150px; box-shadow:0 8px 28px rgba(0,0,0,.5); }
  .langmenu button { display:block; width:100%; padding:8px 16px; border:0; background:transparent; color:var(--txt);
    font:inherit; font-size:13px; text-align:left; cursor:pointer; white-space:nowrap; }
  .langmenu button.on { color:var(--acc); }
  .langmenu button:hover { background:#16241f; }
  /* ── 播放器 ── */
  main { flex:1; width:100%; max-width:1000px; margin:0 auto; padding:6px clamp(12px,3vw,28px) 30px; }
  .player { background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:20px; padding:14px; box-shadow:0 24px 80px rgba(0,0,0,.45); }
  .stage { position:relative; border-radius:12px; overflow:hidden; background:#050b0a; }
  .scaler { position:absolute; left:0; top:0; width:880px; height:560px; transform-origin:0 0; }
  .scene { position:absolute; inset:0; display:none; }
  .scene.on { display:block; }
  /* ── 浏览器窗口 mockup ── */
  .win { position:absolute; left:34px; right:34px; top:30px; bottom:24px; background:#0d181a;
    border:1px solid #233b37; border-radius:14px; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 18px 60px rgba(0,0,0,.5); }
  .wbar { flex:0 0 40px; display:flex; align-items:center; gap:14px; padding:0 16px; background:#0a1315;
    border-bottom:1px solid #1d322e; }
  .dots { display:flex; gap:7px; }
  .dots i { width:11px; height:11px; border-radius:50%; }
  .dots i:nth-child(1){ background:#ff5f57; } .dots i:nth-child(2){ background:#febc2e; } .dots i:nth-child(3){ background:#28c840; }
  .urlbar { flex:1; max-width:430px; height:26px; margin:0 auto; background:#0e1c1a; border:1px solid #24443e;
    border-radius:13px; display:flex; align-items:center; justify-content:center; gap:7px; font-size:13px; color:var(--dim); }
  .urlbar .lock { color:#3a5a54; font-size:11px; }
  .urlbar.ok .lock { color:var(--acc); }
  .urlbar .u { color:#a9c4be; letter-spacing:.5px; }
  .caret { display:inline-block; width:1px; height:13px; background:var(--acc); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  /* ── 站点 mockup ── */
  .site { flex:1; display:flex; flex-direction:column; padding:0 22px; position:relative; }
  .snav { flex:0 0 54px; display:flex; align-items:center; gap:18px; border-bottom:1px solid #1d322e; }
  .slogo { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:900; color:var(--bright); }
  .slogo img { width:22px; height:22px; border-radius:6px; box-shadow:0 0 10px rgba(79,209,181,.35); display:inline-block; object-fit:cover; }
  .slogo b { color:var(--acc); }
  .stabs { display:flex; gap:4px; flex:1; }
  .stab { padding:7px 13px; border-radius:8px; font-size:13px; color:var(--dim); white-space:nowrap; }
  .stab.on { color:var(--acc); background:rgba(79,209,181,.1); font-weight:700; }
  .sconnect { padding:8px 18px; border-radius:999px; font-size:13px; font-weight:800; color:#04211b;
    background:linear-gradient(135deg,var(--acc2),var(--acc)); white-space:nowrap; }
  .sconnect.addr { background:#0e201c; color:var(--acc); border:1px solid #2b6157; position:relative; padding-left:26px; }
  .sconnect.addr::before { content:""; position:absolute; left:10px; top:50%; width:8px; height:8px; margin-top:-4px;
    border-radius:50%; background:#38e08b; box-shadow:0 0 8px #38e08b; }
  .sbody { flex:1; position:relative; overflow:hidden; }
  .pane { position:absolute; inset:0; display:none; }
  .pane.on { display:flex; }
  /* 首页 hero */
  .hero { flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; }
  .hero h1 { font-size:44px; font-weight:900; letter-spacing:4px;
    background:linear-gradient(100deg,#8ff0dc,#4fd1b5 50%,#b9f4e6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { font-size:15px; color:var(--dim); letter-spacing:5px; }
  .hero .bigcta { margin-top:10px; padding:13px 44px; border-radius:999px; font-size:15px; font-weight:900; color:#04211b;
    background:linear-gradient(135deg,var(--acc2),var(--acc)); box-shadow:0 12px 36px var(--glow); }
  /* 矿机页 */
  .plans { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
  .pcard { border-radius:14px; padding:12px 14px; position:relative; background:linear-gradient(180deg,#101b1d,#0c1517);
    border:1px solid var(--border); transition:box-shadow .4s, border-color .4s; }
  .pcard.hot { border-color:#2b6157; }
  .pcard.sel { border-color:var(--acc); box-shadow:0 0 0 2px rgba(79,209,181,.35), 0 0 40px rgba(79,209,181,.15); }
  .ptag { display:inline-block; font-size:12px; font-weight:900; padding:5px 12px; border-radius:999px; color:#04211b;
    background:linear-gradient(135deg,var(--acc2),var(--acc)); }
  .pchip { position:absolute; top:12px; right:12px; font-size:11px; color:#9fe8d8; background:#0d2020;
    border:1px solid #24493f; border-radius:999px; padding:4px 10px; }
  .prow { display:flex; align-items:baseline; gap:8px; margin-top:8px; }
  .prow .n { font-size:26px; font-weight:900; color:var(--acc); text-shadow:0 0 24px rgba(79,209,181,.4); }
  .prow .u { font-size:13px; color:var(--dim); font-weight:700; }
  .parrow { display:flex; align-items:center; gap:8px; margin-top:5px; font-size:12.5px; color:#b9d5cf; font-weight:700; }
  .parrow .ab { padding:3px 9px; border-radius:7px; background:#0d2020; border:1px solid #24493f; }
  .pstats { display:flex; gap:8px; margin-top:9px; }
  .pstat { flex:1; text-align:center; background:#0d181a; border:1px solid #1d322e; border-radius:9px; padding:5px 4px; }
  .pstat b { display:block; font-size:13px; color:var(--bright); }
  .pstat span { display:block; font-size:10.5px; color:var(--dim); margin-top:2px; }
  .pact { width:100%; margin-top:9px; padding:9px 0; border:0; border-radius:999px; font-size:14px; font-weight:900;
    color:#04211b; background:linear-gradient(135deg,var(--acc2),var(--acc)); cursor:default; font-family:inherit; }
  .pact.busy { background:#18231f; color:#e8c96a; border:1px solid #4a4326; }
  .pact.done { background:#0e201c; color:var(--acc); border:1px solid #2b6157; }
  /* 我的矿机列表 */
  .mcard { margin-top:10px; border-radius:14px; padding:14px 16px; background:linear-gradient(180deg,#101b1d,#0c1517);
    border:1px solid var(--border); position:relative; overflow:hidden; }
  .mcard .accent { position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg,var(--acc2),var(--acc)); }
  .mrow { display:flex; align-items:center; justify-content:space-between; }
  .mtitle { display:flex; gap:10px; align-items:center; }
  .mtitle .mi { font-size:22px; }
  .mtitle h4 { font-size:15px; color:var(--bright); }
  .mtitle small { display:block; font-size:11px; color:var(--dim); margin-top:2px; }
  .pill { font-size:11.5px; font-weight:800; padding:5px 12px; border-radius:999px; }
  .pill.run { color:#38e08b; background:rgba(56,224,139,.1); border:1px solid rgba(56,224,139,.35); }
  .mtotal { display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; font-size:12.5px; color:var(--dim); }
  .mtotal b { font-size:17px; color:var(--acc); }
  .mstats { display:flex; gap:8px; margin-top:10px; }
  .mstat { flex:1; background:#0d181a; border:1px solid #1d322e; border-radius:9px; padding:8px 6px; text-align:center; }
  .mstat span { display:block; font-size:10.5px; color:var(--dim); }
  .mstat b { display:block; font-size:13.5px; color:var(--bright); margin-top:2px; }
  .mstat b.pos { color:#38e08b; }
  .pbar { margin-top:12px; height:8px; border-radius:99px; background:#0d181a; border:1px solid #1d322e; overflow:hidden; }
  .pbar i { display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 12px rgba(79,209,181,.5); transition:width 1.4s ease; }
  .pfoot { margin-top:7px; font-size:11.5px; color:var(--dim); }
  /* 钱包下拉 */
  .wdrop { position:absolute; top:47px; right:0; width:210px; background:#101b1d; border:1px solid #2b6157;
    border-radius:12px; padding:6px; z-index:30; box-shadow:0 16px 48px rgba(0,0,0,.6); }
  .witem { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; font-size:13px;
    color:var(--txt); font-weight:700; }
  .witem .ic { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:14px; background:#0d2020; border:1px solid #24493f; }
  .witem:hover, .witem.hl { background:rgba(79,209,181,.12); color:var(--acc); }
  /* 签名弹窗 */
  .dim { position:absolute; inset:0; background:rgba(3,9,8,.62); z-index:20; display:none; }
  .dim.on { display:block; }
  .modal { position:absolute; left:50%; top:50%; width:340px; transform:translate(-50%,-50%); z-index:25;
    background:#101b1d; border:1px solid #2b6157; border-radius:16px; padding:18px; display:none; }
  .modal.on { display:block; }
  .modal h4 { font-size:15px; color:var(--bright); text-align:center; }
  .modal .mtip { margin-top:10px; font-size:12px; line-height:1.75; color:var(--dim); background:#0d181a;
    border:1px solid #1d322e; border-radius:10px; padding:10px 12px; }
  .mbtns { display:flex; gap:10px; margin-top:14px; }
  .mbtn { flex:1; padding:10px 0; border-radius:10px; font-size:13.5px; font-weight:800; text-align:center; font-family:inherit; }
  .mbtn.ghost { background:#0d181a; border:1px solid #24493f; color:var(--dim); }
  .mbtn.main { background:linear-gradient(135deg,var(--acc2),var(--acc)); color:#04211b; border:0; }
  .spin { width:26px; height:26px; margin:14px auto 4px; border-radius:50%; border:3px solid #1d322e;
    border-top-color:var(--acc); animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  /* 支付确认 overlay */
  .pay .amt { text-align:center; margin-top:8px; }
  .pay .amt b { font-size:30px; color:var(--bright); }
  .pay .amt span { display:block; font-size:12px; color:var(--dim); margin-top:4px; letter-spacing:1px; }
  .pay .fee { margin-top:12px; font-size:11.5px; color:var(--dim); text-align:center; }
  /* toast */
  .toast { position:absolute; top:14px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:40; opacity:0;
    background:#0e201c; border:1px solid #2b6157; color:var(--acc); font-size:13px; font-weight:800;
    padding:9px 20px; border-radius:999px; transition:all .4s; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  /* 动画 */
  .pop { animation:pop .5s cubic-bezier(.34,1.4,.5,1) both; }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(6px); } }
  .pulse { animation:pulse 1.15s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(79,209,181,.55); } 70% { box-shadow:0 0 0 14px rgba(79,209,181,0); } 100% { box-shadow:0 0 0 0 rgba(79,209,181,0); } }
  .press { animation:press .22s ease; }
  @keyframes press { 40% { transform:scale(.9); } }
  .cursor { position:absolute; left:0; top:0; width:22px; height:22px; z-index:60; pointer-events:none; opacity:0;
    transition:transform .55s cubic-bezier(.4,0,.2,1), opacity .3s; }
  .cursor::before { content:""; position:absolute; inset:0; border-radius:50%; background:rgba(79,209,181,.25);
    border:2px solid var(--acc2); box-shadow:0 0 16px rgba(79,209,181,.6); }
  .cursor::after { content:""; position:absolute; left:9px; top:9px; width:4px; height:4px; border-radius:50%; background:#fff; }
  .ripple { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; z-index:55;
    pointer-events:none; border:2px solid var(--acc2); animation:rip .55s ease-out both; }
  @keyframes rip { from { opacity:.9; transform:scale(.4); } to { opacity:0; transform:scale(3.2); } }
  .confetti { position:absolute; width:7px; height:7px; z-index:50; pointer-events:none; border-radius:2px; animation:cf 1s ease-out both; }
  @keyframes cf { from { opacity:1; transform:translate(0,0) rotate(0); } to { opacity:0; transform:translate(var(--dx),52px) rotate(220deg); } }
  /* 矿机页（真实布局：子页签 / 团队卡 / 总览） */
  .subtabs { display:flex; gap:6px; margin-top:8px; }
  .subtab { padding:5px 14px; border-radius:9px; font-size:12px; color:var(--dim); background:#0d181a; border:1px solid #1d322e; font-weight:700; white-space:nowrap; }
  .subtab.on { color:var(--acc); background:rgba(79,209,181,.1); border-color:#2b6157; }
  .banner { margin-top:8px; padding:6px 12px; border-radius:11px; background:linear-gradient(120deg,rgba(79,209,181,.14),rgba(79,209,181,.04)); border:1px solid #23453e; color:var(--bright); font-weight:800; font-size:13px; }
  .ts-card { margin-top:8px; border-radius:13px; border:1px solid #23453e; background:linear-gradient(120deg,rgba(79,209,181,.1),rgba(79,209,181,.02)); padding:9px 13px; }
  .ts-top { display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--dim); }
  .ts-top code { color:var(--acc); font-weight:800; }
  .ts-grid { display:flex; gap:10px; margin-top:8px; }
  .ts-cell { flex:1; background:#0d181a; border:1px solid #1d322e; border-radius:10px; padding:6px 10px; display:flex; align-items:center; justify-content:space-between; }
  .ts-cell b { font-size:17px; color:var(--bright); }
  .ts-cell b small { font-size:11px; color:var(--dim); font-weight:700; }
  .ts-cell .l { font-size:11px; color:var(--dim); margin-top:1px; }
  .ts-cell .ico { font-size:17px; }
  .invite { margin-top:8px; display:flex; align-items:center; gap:8px; background:#0d181a; border:1px solid #1d322e; border-radius:9px; padding:5px 9px; }
  .invite .lb { font-size:11px; color:var(--dim); white-space:nowrap; }
  .invite code { flex:1; font-size:11px; color:var(--acc); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .invite button { font-size:10.5px; padding:4px 10px; border-radius:7px; border:1px solid #2b6157; background:#0e201c; color:var(--acc); font-family:inherit; cursor:default; }
  .capwrap { margin-top:10px; }
  .caprow { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .caprow .ct { font-size:12.5px; color:var(--bright); font-weight:800; white-space:nowrap; }
  .caprow .cs { font-size:10.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .capbar { margin-top:6px; height:7px; border-radius:99px; background:#0d181a; border:1px solid #1d322e; overflow:hidden; }
  .capbar i { display:block; height:100%; width:68%; border-radius:99px; background:linear-gradient(90deg,var(--acc),var(--acc2)); }
  .ovcard { margin-top:8px; border:1px solid var(--border); border-radius:13px; background:#0d181a; padding:9px 12px; }
  .ovtitle { font-size:12.5px; color:var(--bright); font-weight:800; margin-bottom:7px; }
  .ovgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .ovcell { background:#101b1d; border:1px solid #1d322e; border-radius:9px; padding:6px 8px; }
  .ovcell .l { font-size:10px; color:var(--dim); }
  .ovcell .v { font-size:13.5px; color:var(--bright); font-weight:800; margin-top:2px; }
  .ovcell .v small { font-size:9.5px; color:var(--dim); font-weight:700; }
  .ovcell .v.c1 { color:#50d2b8; }
  .ovcell .v.c2 { color:#f59e0b; }
  .ovcell .v.c3 { color:#f6c454; }
  .lsec { margin-top:10px; }
  .lhead { display:flex; align-items:baseline; justify-content:space-between; }
  .lhead h3 { font-size:14.5px; color:var(--bright); }
  .lhead span { font-size:11px; color:var(--dim); }
  .lsec .mcard { margin-top:8px; }
  /* 字幕 & 控制 */
  .subbar { min-height:44px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px 16px 2px; }
  .subbar .sub { font-size:14.5px; font-weight:700; color:var(--bright); }
  .ctrl { display:flex; align-items:center; gap:12px; padding:8px 6px 4px; }
  .ctrl .pb { width:40px; height:40px; border-radius:50%; border:0; cursor:pointer; font-size:15px; color:#04211b;
    background:linear-gradient(135deg,var(--acc2),var(--acc)); display:flex; align-items:center; justify-content:center; }
  .segs { flex:1; display:flex; gap:5px; }
  .seg { height:7px; border-radius:99px; background:#132320; overflow:hidden; cursor:pointer; position:relative; }
  .seg i { position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--acc),var(--acc2)); transform:scaleX(0); transform-origin:0 0; }
  .seg.done i { transform:scaleX(1); }
  .clock { font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; min-width:86px; text-align:right; }
  .chips { display:flex; gap:8px; padding:10px 6px 2px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:1 0 auto; padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:#0d181a;
    color:var(--dim); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .chip.on { color:var(--acc); border-color:#2b6157; background:rgba(79,209,181,.08); }
  .chip .no { display:inline-block; width:18px; height:18px; margin-right:6px; border-radius:50%; text-align:center;
    line-height:18px; font-size:11px; background:#132320; color:var(--dim); }
  .chip.on .no { background:var(--acc); color:#04211b; }
  /* 结尾卡 */
  .endcard { position:absolute; inset:0; z-index:70; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(4,10,9,.9); text-align:center; padding:20px; }
  .endcard.on { display:flex; }
  .endcard .ok { width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:36px; color:#04211b; background:linear-gradient(135deg,var(--acc2),var(--acc));
    box-shadow:0 0 50px var(--glow); animation:pop .6s cubic-bezier(.34,1.4,.5,1) both; }
  .endcard p { font-size:16px; font-weight:800; color:var(--bright); }
  .endcard .ebtns { display:flex; gap:12px; margin-top:6px; flex-wrap:wrap; justify-content:center; }
  .endcard .e1 { padding:12px 30px; border-radius:999px; font-size:14px; font-weight:900; color:#04211b; text-decoration:none;

/* ───────── 基础工具 ───────── */
const $ = (id) => document.getElementById(id);
const sceneEl = $('scene'), cursor = $('cursor'), subEl = $('sub'), stage = $('stage'), scaler = $('scaler');
let scale = 1;
function fitStage() {
  scale = stage.clientWidth / 880;
  scaler.style.transform = 'scale(' + scale + ')';
  stage.style.height = Math.round(560 * scale) + 'px';
}
window.addEventListener('resize', fitStage);
document.addEventListener('fullscreenchange', () => setTimeout(fitStage, 60));

function cursorTo(node, ms = 550) {
  const sr = scaler.getBoundingClientRect(), tr = node.getBoundingClientRect();
  const x = (tr.left + tr.width / 2 - sr.left) / scale, y = (tr.top + tr.height / 2 - sr.top) / scale;
  cursor.style.transition = 'transform ' + ms + 'ms cubic-bezier(.4,0,.2,1), opacity .3s';
  cursor.style.transform = 'translate(' + (x - 11) + 'px,' + (y - 11) + 'px)';
  cursor.style.opacity = '1';
}
function cursorHide() { cursor.style.opacity = '0'; }
function clickFx(node) {
  node.classList.remove('press'); void node.offsetWidth; node.classList.add('press');
  const sr = scaler.getBoundingClientRect(), tr = node.getBoundingClientRect();
  const x = (tr.left + tr.width / 2 - sr.left) / scale, y = (tr.top + tr.height / 2 - sr.top) / scale;
  const r = document.createElement('i'); r.className = 'ripple';
  r.style.left = x + 'px'; r.style.top = y + 'px';
  scaler.appendChild(r); setTimeout(() => r.remove(), 600);
}
function pulse(node) { node.classList.remove('pulse'); void node.offsetWidth; node.classList.add('pulse'); }
function confettiAt(node) {
  const sr = scaler.getBoundingClientRect(), tr = node.getBoundingClientRect();
  const cx = (tr.left + tr.width / 2 - sr.left) / scale, cy = (tr.top + tr.height / 2 - sr.top) / scale;
  const colors = ['#4fd1b5', '#8ff0dc', '#ffd76a', '#ff8f6a', '#7ab8ff'];
  for (let i = 0; i < 14; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = cx + 'px'; c.style.top = cy + 'px';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    c.style.animationDelay = (i * 30) + 'ms';
    scaler.appendChild(c); setTimeout(() => c.remove(), 1300);
  }
}
const sleepT = (ms) => ({ t: ms, run: () => {} });

                <div class="mtitle"><span class="mi">⚡</span><div><h4>${t('m_minit')}</h4><small>${t('m_minisub')}</small></div></div>
                <span class="pill run pulse" id="runPill">${t('m_running')}</span>
              </div>
              <div class="mtotal"><span>${t('m_goal')}</span><b>100.00 <small>AIX</small></b></div>
              <div class="mstats">
                <div class="mstat"><span>${t('m_earned')}</span><b class="pos" id="stE">3.33 <small>AIX</small></b></div>
                <div class="mstat"><span>${t('m_left')}</span><b>96.67 <small>AIX</small></b></div>
                <div class="mstat"><span>${t('m_prog')}</span><b id="stP">0.00<small>%</small></b></div>
              </div>
              <div class="pbar"><i id="pfill"></i></div>
              <div class="pfoot">${t('m_expire')}</div>
            </div>
          </div>
        </div>`;
      const card = sceneEl.querySelector('#mcard');
      const beats = [
        { t: 600, run: () => cursorTo(card, 500) },
        { t: 1500, run: () => { sceneEl.querySelector('#pfill').style.width = '3.33%'; sceneEl.querySelector('#stP').innerHTML = '3.33<small>%</small>'; } },
        { t: 3200, run: () => { pulse(sceneEl.querySelector('#runPill')); cursorHide(); } },
      ];
      return beats;
    } },
];

/* ───────── 播放器时间线 ───────── */
const segsEl = $('segs'), chipsEl = $('chips'), clockEl = $('clock'), playBtn = $('playBtn');
const TOTAL = SCENES.reduce((s, x) => s + x.dur, 0);
let idx = 0, tms = 0, bi = 0, beats = [], playing = false, ended = false, capKey = '';

SCENES.forEach((s, i) => {
  const seg = document.createElement('div'); seg.className = 'seg';
  seg.style.flexGrow = String(s.dur / 1000);
  seg.innerHTML = '<i></i>';
  seg.onclick = () => seek(i);
  segsEl.appendChild(seg);
  const chip = document.createElement('div'); chip.className = 'chip';
  chip.innerHTML = '<span class="no">' + (i + 1) + '</span><span data-k="' + s.key + '">' + t(s.key) + '</span>';
  chip.onclick = () => seek(i);
  chipsEl.appendChild(chip);
});
const segFills = [...segsEl.querySelectorAll('.seg i')];
const segEls = [...segsEl.children];
const chipEls = [...chipsEl.children];

function fmt(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function updateHud() {
  const done = SCENES.slice(0, idx).reduce((s, x) => s + x.dur, 0);
  clockEl.textContent = fmt(done + Math.min(tms, SCENES[idx].dur)) + ' / ' + fmt(TOTAL);
  segFills.forEach((f, i) => {
    const p = i < idx ? 1 : i > idx ? 0 : Math.min(1, tms / SCENES[idx].dur);
    f.style.transform = 'scaleX(' + p + ')';
    segEls[i].classList.toggle('done', i < idx);
  });
  chipEls.forEach((c, i) => c.classList.toggle('on', i === idx));
}
function setCap(key) {
  if (key === capKey) return;
  capKey = key;
  subEl.style.opacity = '0';
  setTimeout(() => { subEl.textContent = t(key); subEl.style.opacity = '1'; }, 140);
}
subEl.style.transition = 'opacity .14s';

function load(i) {
  idx = i; tms = 0; bi = 0; ended = false;
  cursorHide(); cursor.style.transform = 'translate(-40px,-40px)';
  document.querySelectorAll('.toast').forEach(x => x.classList.remove('on'));
  beats = SCENES[i].build() || [];
  beats.sort((a, b) => a.t - b.t);
  setCap(SCENES[i].caps[0][1]);
  $('endcard').classList.remove('on');
  sceneEl.classList.add('on');
  updateHud();
}
function next() {
  if (idx + 1 < SCENES.length) { load(idx + 1); return; }
  ended = true; playing = false; playBtn.textContent = '▶';
  cursorHide();
  $('endcard').classList.add('on');
}
function seek(i) { load(i); if (!playing && !ended) { playing = true; playBtn.textContent = '⏸'; } last = performance.now(); }
function togglePlay() {
  if (ended) { load(0); playing = true; playBtn.textContent = '⏸'; last = performance.now(); return; }
  playing = !playing; playBtn.textContent = playing ? '⏸' : '▶';
  last = performance.now();
}
playBtn.onclick = togglePlay;
$('replayBtn').onclick = () => { load(0); playing = true; playBtn.textContent = '⏸'; last = performance.now(); };
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '')) { e.preventDefault(); togglePlay(); }
});
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $('player').requestFullscreen?.();
};

let last = performance.now();
function frame(now) {
  const dt = now - last; last = now;
  if (playing && !ended) {
    tms += dt;
    const cur = SCENES[idx];
    while (bi < beats.length && beats[bi].t <= tms) { try { beats[bi].run(); } catch (e) { console.error(e); } bi++; }
    const capHit = [...cur.caps].reverse().find(c => c[0] <= tms);
    if (capHit) setCap(capHit[1]);
    if (tms >= cur.dur) next(); else updateHud();
  }
  requestAnimationFrame(frame);
}

/* ───────── 语言菜单 & 静态文案 ───────── */
function applyLang() {
  document.documentElement.lang = cur === 'zh-TW' ? 'zh-TW' : cur;
  document.title = t('title');
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = t(el.dataset.k); });
  chipEls.forEach((c, i) => { c.querySelector('[data-k]').textContent = t(SCENES[i].key); });
  capKey = ''; setCap(SCENES[idx].caps[0][1]);
  if (!ended) load(idx); // 重建当前场景以翻译 mockup
  else $('endcard').querySelector('[data-k]').textContent = t('end1');
}
$('langBtn').onclick = (e) => {
  e.stopPropagation();
  let m = document.querySelector('.langmenu');
  if (m) { m.remove(); return; }
  m = document.createElement('div'); m.className = 'langmenu';
  const labels = [['zh', '简体中文'], ['zh-TW', '繁體中文'], ['en', 'English'], ['ja', '日本語'], ['ko', '한국어'], ['ru', 'Русский'], ['es', 'Español']];
  labels.forEach(([code, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = (code === cur ? '✓ ' : '　') + label;
    if (code === cur) b.classList.add('on');
    b.onclick = () => {
      cur = code;
      try { localStorage.setItem(KEY, cur); } catch {}
      m.remove(); applyLang();
    };
    m.appendChild(b);
  });
  const r = $('langBtn').getBoundingClientRect();
  m.style.top = (r.bottom + 6) + 'px';
  m.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  document.body.appendChild(m);
};
document.addEventListener('click', () => document.querySelector('.langmenu')?.remove());

/* ───────── 启动 ───────── */
fitStage();
document.querySelectorAll('[data-k]').forEach(el => { el.textContent = t(el.dataset.k); });
load(0);
playing = true; playBtn.textContent = '⏸';
requestAnimationFrame(frame);
</script>
